# Enables RGB functionality (Uncomment lines below to enable.)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_STUDIO=n
# CONFIG_ZMK_STUDIO_LOCKING=n 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# ディープスリープを有効化（15分でスリープ）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# アイドルタイムアウトを15秒に短縮（ディスプレイやLEDを早めに消す）
CONFIG_ZMK_IDLE_TIMEOUT=15000

# バッテリー状況をOSに報告する
CONFIG_ZMK_BATTERY_REPORTING=y
# OLEDディスプレイを有効化
CONFIG_ZMK_DISPLAY=y

# バッテリー表示（ウィジェット）を有効にする
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# アイコンではなく「％」で表示したい場合は y にする
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# --- 他の表示をオフにする ---
# レイヤー名の表示をオフ
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
# 接続先(Bluetooth/USB)の表示をオフ
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
# タイピング速度(WPM)の表示をオフ（デフォルトnですが念のため）
CONFIG_ZMK_WIDGET_WPM_STATUS=n
